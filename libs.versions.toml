[versions]
minecraft     = "26.3"
fabric-loader = "0.19.5"
fabric-api    = "0.160.2+26.3"
fabric-kotlin = "1.13.12+kotlin.2.4.0"
arcade        = "0.14.0-beta.5+26.3"

# Plugins
fabric-loom   = "1.17-SNAPSHOT"
mod-publish   = "2.2.0"

[libraries]
minecraft             = { module = "com.mojang:minecraft"                             , version.ref = "minecraft" }
fabric-loader         = { module = "net.fabricmc:fabric-loader"                       , version.ref = "fabric-loader" }
fabric-api            = { module = "net.fabricmc.fabric-api:fabric-api"               , version.ref = "fabric-api" }
fabric-kotlin         = { module = "net.fabricmc:fabric-language-kotlin"              , version.ref = "fabric-kotlin" }
arcade-replay         = { module = "net.casualchampionships:arcade-replay"            , version.ref = "arcade" }
arcade-commands       = { module = "net.casualchampionships:arcade-commands"          , version.ref = "arcade" }
arcade-event-registry = { module = "net.casualchampionships:arcade-event-registry"    , version.ref = "arcade" }
arcade-events-server  = { module = "net.casualchampionships:arcade-events-server"     , version.ref = "arcade" }
arcade-resource-pack  = { module = "net.casualchampionships:arcade-resource-pack"     , version.ref = "arcade" }
arcade-rph            = { module = "net.casualchampionships:arcade-resource-pack-host", version.ref = "arcade" }
arcade-interceptor    = { module = "net.casualchampionships:arcade-interceptor"       , version.ref = "arcade" }
arcade-utils          = { module = "net.casualchampionships:arcade-utils"             , version.ref = "arcade" }

[bundles]
arcade = ["arcade-replay", "arcade-commands", "arcade-event-registry", "arcade-events-server", "arcade-resource-pack", "arcade-rph", "arcade-interceptor", "arcade-utils"]

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom"       , version.ref = "fabric-loom" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }